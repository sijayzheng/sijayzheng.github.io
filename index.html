<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8"/>
  <title>Sijay Zheng</title>
  <meta content="IE=edge,chrome=1" http-equiv="X-UA-Compatible"/>
  <meta content="Description" name="description"/>
  <meta content="width=device-width, initial-scale=1.0, minimum-scale=1.0" name="viewport"/>
  <link href="./assets/favicon.ico" rel="shortcut icon" type="image/x-icon"/>
  <link href="./assets/css/vue.css" rel="stylesheet"/>
</head>

<body>
<div id="app"></div>
<script>
  window.$docsify = {
    name: 'Sijay', // 项目名称
    repo: 'https://github.com/sijayzheng/', // 仓库地址
    loadSidebar: true, // 侧边栏支持，默认加载的是项目根目录下的_sidebar.md文件
    auto2top: true, //切换页面后是否自动跳转到页面顶部。
    autoHeader: true, //可以根据 _sidebar.md 的内容自动为每个页面增加标题
    maxLevel: 2, // 最大支持渲染的标题层级
    subMaxLevel: 2,
    search: {
      placeholder: '👉搜索',
      noData: '冇啊',
      depth: 4,
    },
  }
</script>
<!-- Docsify v4 -->
<script src="./assets/js/docsify@4.js"></script>
<script src="./assets/js/prism-java.min.js"></script>
<script src="./assets/js/prism-bash.min.js"></script>
<script src="./assets/js/prism-ini.min.js"></script>
<script src="./assets/js/search.min.js"></script>
<script src="./assets/js/docsify-copy-code.min.js"></script>
<script src="./assets/js/zoom-image.min.js"></script>
</body>
</html>
